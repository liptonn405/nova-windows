[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-windows"
version = "0.1.0"
description = "NOVA — local Windows 11 desktop companion and bounded Ollama agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6-Essentials>=6.8,<7", "httpx>=0.28,<0.29", "psutil>=6,<8",
  "pywin32>=308; sys_platform == 'win32'",
  "pycaw>=20240210; sys_platform == 'win32'",
  "pyvda>=0.6.0,<0.7; sys_platform == 'win32'",
  "winrt-runtime>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Media>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Media.Control>=3,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
voice = ["vosk==0.3.45", "sounddevice>=0.5,<0.6"]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.gui-scripts]
nova = "nova.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
